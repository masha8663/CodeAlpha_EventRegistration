<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CodeAlpha - VIP Event Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --text-color: #f8fafc;
      --border-color: rgba(255, 255, 255, 0.15);
    }
    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-color: #0f172a;
      --border-color: rgba(0, 0, 0, 0.1);
    }
    body { background: var(--bg-gradient); color: var(--text-color); min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: all 0.3s ease; }
    .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .theme-toggle { position: fixed; top: 20px; right: 20px; border-radius: 50%; width: 45px; height: 45px; z-index: 100; display: flex; align-items: center; justify-content: center; }
    .btn-gradient { background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%); border: none; color: white; font-weight: bold; }
    .btn-gradient:hover { opacity: 0.9; color: white; }
  </style>
</head>
<body data-theme="dark">

  <button class="btn btn-secondary theme-toggle shadow" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></button>

  <div class="container py-5">
    <div class="text-center mb-5">
      <h1 class="display-4 fw-bold">✨ EventSphere VIP Portal</h1>
      <p class="lead opacity-75">Discover, Register & Host Premium Technical Events</p>
    </div>

    <!-- Organizer Quick Publish Section -->
    <div class="glass-card p-4 mb-5">
      <h4 class="mb-3 text-info"><i class="fas fa-plus-circle me-2"></i>Quick Publish Event (Organizer Panel)</h4>
      <div class="row g-3">
        <div class="col-md-4"><input type="password" id="admin-key" class="form-control" placeholder="Organizer Key (admin123)"></div>
        <div class="col-md-4"><input type="text" id="ev-title" class="form-control" placeholder="Event Title"></div>
        <div class="col-md-4"><input type="date" id="ev-date" class="form-control"></div>
        <div class="col-md-6"><input type="text" id="ev-loc" class="form-control" placeholder="Location (Online / Venue)"></div>
        <div class="col-md-3"><input type="text" id="ev-cat" class="form-control" placeholder="Category (e.g. Workshop)"></div>
        <div class="col-md-3"><input type="text" id="ev-price" class="form-control" placeholder="Price (e.g. Free)"></div>
        <div class="col-12"><textarea id="ev-desc" class="form-control" placeholder="Event Description..."></textarea></div>
        <div class="col-12"><button type="button" class="btn btn-gradient btn-lg w-100" onclick="submitNewEvent()"><i class="fas fa-paper-plane me-2"></i>Publish Event Now</button></div>
      </div>
    </div>

    <!-- Email Search Registrations Section -->
    <div class="glass-card p-4 mb-5">
      <h4 class="mb-3"><i class="fas fa-search me-2"></i>Search My Registrations</h4>
      <div class="row g-3">
        <div class="col-md-9"><input type="email" id="search-email" class="form-control form-control-lg" placeholder="Enter your registered email address..."></div>
        <div class="col-md-3"><button class="btn btn-gradient btn-lg w-100" onclick="fetchMyRegistrations()"><i class="fas fa-ticket-alt me-2"></i>Search Bookings</button></div>
      </div>
      <div id="my-registrations" class="mt-4 row g-3"></div>
    </div>

    <!-- Events List -->
    <h3 class="mb-4"><i class="fas fa-calendar-star me-2"></i>Featured Live Events</h3>
    <div id="events-list" class="row g-4"></div>
  </div>

  <script>
    function toggleTheme() {
      const body = document.body;
      const icon = document.getElementById('theme-icon');
      if (body.getAttribute('data-theme') === 'dark') {
        body.setAttribute('data-theme', 'light');
        icon.className = 'fas fa-sun';
      } else {
        body.setAttribute('data-theme', 'dark');
        icon.className = 'fas fa-moon';
      }
    }

    async function loadEvents() {
      try {
        const res = await fetch('/api/events');
        const events = await res.json();
        document.getElementById('events-list').innerHTML = events.map(e => `
          <div class="col-md-4">
            <div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
              <div>
                <span class="badge bg-primary mb-2">${e.category || 'Event'}</span>
                <h4 class="fw-bold">${e.title}</h4>
                <p class="opacity-75 small">${e.description}</p>
                <p class="mb-1 small"><i class="fas fa-calendar-day me-2"></i>${e.date}</p>
                <p class="small"><i class="fas fa-location-dot me-2"></i>${e.location}</p>
              </div>
              <div class="mt-3">
                <input type="text" id="name-${e._id}" class="form-control form-control-sm mb-2" placeholder="Your Name">
                <input type="email" id="email-${e._id}" class="form-control form-control-sm mb-2" placeholder="Your Email">
                <button class="btn btn-gradient btn-sm w-100" onclick="registerUser('${e._id}')"><i class="fas fa-check-circle me-1"></i>Confirm Seat</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function submitNewEvent() {
      const authKey = document.getElementById('admin-key').value;
      const title = document.getElementById('ev-title').value;
      const description = document.getElementById('ev-desc').value;
      const date = document.getElementById('ev-date').value;
      const location = document.getElementById('ev-loc').value;
      const category = document.getElementById('ev-cat').value;
      const price = document.getElementById('ev-price').value;

      if (!authKey || !title || !description || !date || !location) {
        alert('Please fill out Key, Title, Description, Date and Location!');
        return;
      }

      const response = await fetch('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ authKey, title, description, date, location, category, price })
      });

      const result = await response.json();

      if (response.ok) {
        alert('🎉 Event Published Successfully!');
        document.getElementById('ev-title').value = '';
        document.getElementById('ev-desc').value = '';
        loadEvents();
      } else {
        alert(result.error || 'Failed to publish event');
      }
    }

    async function registerUser(eventId) {
      const userName = document.getElementById(`name-${eventId}`).value;
      const userEmail = document.getElementById(`email-${eventId}`).value;
      if (!userName || !userEmail) return alert('Enter name & email!');
      
      await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userName, userEmail, eventId })
      });
      alert('Registered Successfully!');
    }

    async function fetchMyRegistrations() {
      const email = document.getElementById('search-email').value;
      if (!email) return alert('Please enter your email!');
      
      const res = await fetch(`/api/registrations/${email}`);
      const data = await res.json();
      
      if (data.length === 0) {
        document.getElementById('my-registrations').innerHTML = `<p class="text-warning">No registrations found for this email.</p>`;
        return;
      }

      document.getElementById('my-registrations').innerHTML = data.map(r => `
        <div class="col-md-6">
          <div class="glass-card p-3">
            <h5 class="fw-bold">${r.eventId ? r.eventId.title : 'Event Details'}</h5>
            <p class="small mb-1"><i class="fas fa-calendar me-2"></i>${r.eventId ? r.eventId.date : 'N/A'}</p>
            <p class="small mb-2"><i class="fas fa-user me-2"></i>Registered Name: ${r.userName}</p>
            <button class="btn btn-danger btn-sm" onclick="cancelReg('${r._id}')"><i class="fas fa-trash me-1"></i>Cancel Registration</button>
          </div>
        </div>
      `).join('');
    }

    async function cancelReg(id) {
      await fetch(`/api/registrations/${id}`, { method: 'DELETE' });
      alert('Registration Cancelled!');
      fetchMyRegistrations();
    }

    loadEvents();
  </script>
</body>
</html>
